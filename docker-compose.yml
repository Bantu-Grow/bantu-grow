services:
  app:
    image: ghcr.io/bantu-grow/bantu-grow:latest
    container_name: bantugrowcom-app
    expose:
      - "3000"
    networks:
      - proxy
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/bantugrow.db
    volumes:
      - app_data:/data
    restart: always

networks:
  proxy:
    external: true

volumes:
  app_data:
    name: bantugrowcom_app_data
    external: true
